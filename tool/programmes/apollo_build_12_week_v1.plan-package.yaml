# Canonical Plan Package v1 for founder-authored internal Apollo dogfood content.
# Executable prescription remains exclusively in the referenced committed protocols.

package_schema_version: 1

programme:
  lineage_code: APOLLO-BUILD-12-WEEK
  version_number: 2
  name: Apollo Build — 12-Week Initial Block
  description: >-
    Founder-authored internal dogfood package for the complete Apollo Build initial
    block. Version 2 places genuine interval/threshold quality work before Racehorse
    Strength in weeks 1–11. Week 12 assessment and recovery order is unchanged.
    It schedules the committed executable protocols without creating a hosted
    programme version or duplicating their prescriptions.
  library_scope: organisation
  owner_type: organisation
  coaching_intent: >-
    Build an Apollo physique while retaining athletic capability, developing the
    Racehorse posterior chain, improving aerobic capacity, and arriving fresh.
  duration_weeks: 12
  sessions_per_week: 7
  primary_goal: Concurrent strength, hypertrophy, athleticism and cardiovascular development.

