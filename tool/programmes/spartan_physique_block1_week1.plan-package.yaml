# Canonical Plan Package v1 for the founder-authored Spartan Physique Block 1.
# The referenced protocol revisions retain the complete training prescription.

package_schema_version: 1

programme:
  lineage_code: SPARTAN-PHYSIQUE
  version_number: 3
  name: Spartan Physique Block 1
  description: >-
    Block 1 Week 1 — build a lean, strong, athletic Spartan physique with upper-body
    relative strength, single-leg and posterior-chain work, aerobic base, and consistent
    bodyweight and core training.
  library_scope: cohort_global
  owner_type: global
  coaching_intent: >-
    Prioritise upper-body relative strength and muscular development while maintaining
    posterior-chain and unilateral leg work, aerobic capacity, and core stability.
  duration_weeks: 1
  sessions_per_week: 6
  primary_goal: >-
    Prioritise upper-body relative strength and muscular development while maintaining
    posterior-chain and unilateral leg work, aerobic capacity, and core stability.

