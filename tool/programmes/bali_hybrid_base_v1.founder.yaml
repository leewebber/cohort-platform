schema_version: 1
programme:
  import_key: "founder-bali-hybrid-base-v1"
  title: "Bali Hybrid Base"
  code: "BALI-HYBRID-BASE"
  description: "Internal / Lee-specific private 8-week hybrid base. 71 sessions. No running required. Not a public catalogue programme."
  objective: "Prepare to enter a later 16-week elite HYROX race-preparation phase."
  duration_weeks: 8
  sessions_per_week: 9
weeks:
  - week_number: 1
    title: "Week 1"
    days:
      - day_number: 1
        display_name: "Saturday"
        is_rest_day: false
        sessions:
          - title: "Strength A — Heavy Lower + Pull"
            session_type: "strength"
            estimated_duration_minutes: 75
            coach_notes: "Maintain/develop high force production. Primary adaptation: Maximum / relative strength. Load: moderately hard."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                coach_notes: "12–15 min. 5 min easy BikeErg, then 2 rounds of the listed movements."
                exercises:
                  - exercise_name: "Easy BikeErg"
                    exercise_slug: "easy-bikeerg"
                    order: 1
                    prescription:
                      sets: 1
                      duration: "5 min"
                  - exercise_name: "Bodyweight squat"
                    exercise_slug: "bodyweight-squat"
                    order: 2
                    prescription:
                      sets: 2
                      reps: 8
                  - exercise_name: "Reverse lunge"
                    exercise_slug: "reverse-lunge"
                    order: 3
                    prescription:
                      sets: 2
                      reps: "8/side"
                  - exercise_name: "Glute bridge"
                    exercise_slug: "glute-bridge"
                    order: 4
                    prescription:
                      sets: 2
                      reps: 10
                  - exercise_name: "Cossack squat"
                    exercise_slug: "cossack-squat"
                    order: 5
                    prescription:
                      sets: 2
                      reps: "8 alternating"
                  - exercise_name: "Band pull-apart"
                    exercise_slug: "band-pull-apart"
                    order: 6
                    prescription:
                      sets: 2
                      reps: 10
                  - exercise_name: "Scapular pull-up"
                    exercise_slug: "scapular-pull-up"
                    order: 7
                    prescription:
                      sets: 2
                      reps: 8
                  - exercise_name: "Calf raise"
                    exercise_slug: "calf-raise"
                    order: 8
                    prescription:
                      sets: 2
                      reps: 10
                  - exercise_name: "Front squat warm-up sets"
                    exercise_slug: "front-squat-warm-up-sets"
                    order: 9
                    prescription:
                      sets: 1
                    notes: "Progressive warm-up sets. Do not turn the warm-up into conditioning."
              - title: "Main strength"
                block_type: "strength"
                order: 2
                coach_notes: "Leave feeling that this was a good strength session and you could have done more. Record load/reps/RPE every working set. Athlete-selected loads."
                exercises:
                  - exercise_name: "Front squat"
                    exercise_slug: "front-squat"
                    order: 1
                    prescription:
                      sets: 4
                      reps: 5
                      rest_seconds: "180-240"
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                    notes: "Full controlled depth, strong brace, fast concentric intent, no grinders. Final set ~3 RIR."
                  - exercise_name: "Romanian deadlift"
                    exercise_slug: "romanian-deadlift"
                    order: 2
                    prescription:
                      sets: 3
                      reps: 6
                      rest_seconds: "150-180"
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                    notes: "Slow controlled eccentric, strong hip extension. Do not chase DOMS."
                  - exercise_name: "Weighted pull-up"
                    exercise_slug: "weighted-pull-up"
                    order: 3
                    prescription:
                      sets: 4
                      reps: 5
                      rest_seconds: "150-180"
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        load_label: "External load"
                        rpe: true
                    notes: "Dead hang → chest high → controlled descent. Clean reps. Record load."
                  - exercise_name: "Rear-foot-elevated split squat"
                    exercise_slug: "rear-foot-elevated-split-squat"
                    order: 4
                    prescription:
                      sets: 3
                      reps: "8/leg"
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                    notes: "DBs at sides. Controlled eccentric. Also serves future running-preparation work."
                  - exercise_name: "Chest-supported row"
                    exercise_slug: "chest-supported-row"
                    order: 5
                    prescription:
                      sets: 3
                      reps: "8-10"
                      load:
                        type: "freeText"
                        text: "RPE 7-8"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                    notes: "Full scapular movement."
                  - exercise_name: "Ab wheel"
                    exercise_slug: "ab-wheel"
                    order: 6
                    prescription:
                      sets: 3
                      reps: "8-12"
                      load:
                        type: "bodyweight"
                    notes: "Stop before lumbar extension substitutes for abdominal control."
                  - exercise_name: "Farmer carry"
                    exercise_slug: "farmer-carry"
                    order: 7
                    prescription:
                      sets: 3
                      distance: "40 m"
                      performance_capture:
                        load_unit: "kg"
                        distance_unit: "m"
                        rpe: false
                    notes: "Heavy. Challenge grip/posture without compromising walking mechanics."
              - title: "Cooldown"
                block_type: "cool_down"
                order: 99
                coach_notes: "Do not add conditioning."
                exercises:
                  - exercise_name: "Very easy BikeErg"
                    exercise_slug: "very-easy-bikeerg"
                    order: 1
                    prescription:
                      sets: 1
                      duration: "5 min"
      - day_number: 2
        display_name: "Sunday"
        is_rest_day: false
        sessions:
          - title: "Long Aerobic — BikeErg"
            session_type: "conditioning"
            estimated_duration_minutes: 60
            coach_notes: "Engine-building continuous BikeErg. Primary adaptation: Aerobic capacity. Load: easy."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                exercises:
                  - exercise_name: "BikeErg progressive warm-up"
                    exercise_slug: "bikeerg-progressive-warm-up"
                    order: 1
                    prescription:
                      duration: "10 min progressive — 5 min extremely easy, 3 min easy, 2 min approaching target aerobic effort."
                      modality: "BikeErg"
                      runtime: "time_based_steady_state"
                      numeric_target: "none"
                      b2_calculation: false
              - title: "Main"
                block_type: "conditioning"
                order: 2
                coach_notes: "First major engine-building session. Breathing controlled; able to speak in sentences. HR observational this week. Known max HR around 195 — do not blindly chase a generic percentage. Record every 10 min: watts, HR, cadence; also average watts, average HR, final HR, RPE. Do not increase output because you are bored."
                exercises:
                  - exercise_name: "BikeErg continuous aerobic"
                    exercise_slug: "bikeerg-continuous-aerobic"
                    order: 1
                    prescription:
                      duration: "45 min continuous Z2 at RPE 3–4/10."
                      modality: "BikeErg"
                      runtime: "time_based_steady_state"
                      numeric_target: "none"
                      b2_calculation: false
              - title: "Cooldown"
                block_type: "cool_down"
                order: 3
                exercises:
                  - exercise_name: "Easy BikeErg"
                    exercise_slug: "easy-bikeerg"
                    order: 1
                    prescription:
                      duration: "5 min extremely easy"
                      modality: "BikeErg"
                      runtime: "time_based_steady_state"
                      numeric_target: "none"
                      b2_calculation: false
          - title: "Strength B — Upper Strength"
            session_type: "strength"
            estimated_duration_minutes: 55
            coach_notes: "Useful upper-body strength without unnecessary hypertrophy volume. Primary adaptation: Upper strength / shoulder robustness. Load: moderate."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                exercises:
                  - exercise_name: "Easy SkiErg"
                    exercise_slug: "easy-skierg"
                    order: 1
                    prescription:
                      duration: "5 min"
                  - exercise_name: "Band external rotation"
                    exercise_slug: "band-external-rotation"
                    order: 2
                    notes: "Include scapular pull-ups, wall slides, band pull-aparts and light overhead pressing."
              - title: "Upper strength"
                block_type: "strength"
                order: 2
                coach_notes: "Ideally 6+ hours after BikeErg. This is not supposed to create huge upper-body fatigue."
                exercises:
                  - exercise_name: "Strict press"
                    exercise_slug: "strict-press"
                    order: 1
                    prescription:
                      sets: 4
                      reps: 5
                      rest_seconds: "150-180"
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                    notes: "No leg drive."
                  - exercise_name: "Pull-up"
                    exercise_slug: "pull-up"
                    order: 2
                    prescription:
                      sets: 4
                      reps: 8
                    notes: "Bodyweight initially; lightly load if trivial. Keep 2–3 RIR."
                  - exercise_name: "Incline DB press"
                    exercise_slug: "incline-db-press"
                    order: 3
                    prescription:
                      sets: 3
                      reps: 8
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                  - exercise_name: "Chest-supported/cable row"
                    exercise_slug: "chest-supported-cable-row"
                    order: 4
                    prescription:
                      sets: 3
                      reps: 10
                  - exercise_name: "Face pull"
                    exercise_slug: "face-pull"
                    order: 5
                    prescription:
                      sets: 3
                      reps: "12-15"
                  - exercise_name: "Cable/band external rotation"
                    exercise_slug: "cable-band-external-rotation"
                    order: 6
                    prescription:
                      sets: 3
                      reps: "12-15/side"
                  - exercise_name: "Dead hang"
                    exercise_slug: "dead-hang"
                    order: 7
                    prescription:
                      sets: 3
                      duration: "30-60 sec"
                    notes: "Shoulders controlled."
      - day_number: 3
        display_name: "Monday"
        is_rest_day: false
        sessions:
          - title: "Threshold A — BikeErg"
            session_type: "conditioning"
            estimated_duration_minutes: 60
            coach_notes: "Flagship aerobic-quality session. Primary adaptation: LT2 / sustainable power. Load: hard."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                coach_notes: "~15 min."
                exercises:
                  - exercise_name: "Progressive easy cycling"
                    exercise_slug: "progressive-easy-cycling"
                    order: 1
                    prescription:
                      duration: "10 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                  - exercise_name: "High-cadence opener"
                    exercise_slug: "high-cadence-opener"
                    order: 2
                    prescription:
                      sets: 3
                      duration: "30 sec high cadence / 60 sec easy"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                  - exercise_name: "Moderately hard"
                    exercise_slug: "moderately-hard"
                    order: 3
                    prescription:
                      duration: "2 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                  - exercise_name: "Easy"
                    exercise_slug: "easy"
                    order: 4
                    prescription:
                      duration: "2 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
              - title: "Main"
                block_type: "conditioning"
                order: 2
                exercises:
                  - exercise_name: "BikeErg threshold intervals"
                    exercise_slug: "bikeerg-threshold-intervals"
                    order: 1
                    prescription:
                      duration: "3 × 8 min controlled threshold"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                    notes: "Recovery: 3 min very easy. RPE ~7/10 initially → perhaps 8/10 late. Highest output you can hold extremely consistently. Example 255/256/254 W = excellent; 255/245/225 = first interval too aggressive. Record average HR each interval, final HR, average watts, cadence and RPE. Total ~55–60 min."
              - title: "Cooldown"
                block_type: "cool_down"
                order: 3
                exercises:
                  - exercise_name: "Easy BikeErg"
                    exercise_slug: "easy-bikeerg"
                    order: 1
                    prescription:
                      duration: "10 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
          - title: "Muscular Endurance — Structural Capacity"
            session_type: "conditioning"
            estimated_duration_minutes: 45
            coach_notes: "Loaded movement, repeated force and aerobic recovery; at least 6 hours after threshold. Primary adaptation: Repeatable functional force. Load: moderate."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                exercises:
                  - exercise_name: "Movement preparation + easy Ski/row"
                    exercise_slug: "movement-preparation-+-easy-ski-row"
                    order: 1
                    prescription:
                      duration: "10 min"
              - title: "Main — mixed muscular endurance"
                block_type: "conditioning"
                order: 2
                coach_notes: "4 rounds. Each working block is 4-minute working block, then 3 min complete/easy recovery. RPE 6–7, not 10. Sled moderately heavy but continuous; farmer carry challenging but unbroken; step-ups moderate with perfect mechanics; Ski controlled. Record sled load, farmer load, step-up load, Ski metres, HR and round RPE. Manual capture — not an automated running workout."
                exercises:
                  - exercise_name: "Sled push"
                    exercise_slug: "sled-push"
                    order: 1
                    prescription:
                      distance: "20 m"
                      performance_capture:
                        load_unit: "kg"
                        distance_unit: "m"
                        rpe: false
                    notes: "Each working block."
                  - exercise_name: "Sled pull"
                    exercise_slug: "sled-pull"
                    order: 2
                    prescription:
                      distance: "20 m"
                      performance_capture:
                        load_unit: "kg"
                        distance_unit: "m"
                        rpe: false
                  - exercise_name: "Farmer carry"
                    exercise_slug: "farmer-carry"
                    order: 3
                    prescription:
                      distance: "40 m"
                      performance_capture:
                        load_unit: "kg"
                        distance_unit: "m"
                        rpe: false
                  - exercise_name: "DB step-up"
                    exercise_slug: "db-step-up"
                    order: 4
                    prescription:
                      reps: "10 DB step-ups (5/leg)"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                  - exercise_name: "Easy/moderate SkiErg"
                    exercise_slug: "easy-moderate-skierg"
                    order: 5
                    notes: "Remaining time in the working block. Controlled."
      - day_number: 4
        display_name: "Tuesday"
        is_rest_day: false
        sessions:
          - title: "Aerobic Efficiency — BikeErg"
            session_type: "conditioning"
            estimated_duration_minutes: 50
            coach_notes: "Standardised fixed-output aerobic session. Primary adaptation: Aerobic efficiency / recovery. Load: easy."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                exercises:
                  - exercise_name: "BikeErg"
                    exercise_slug: "bikeerg"
                    order: 1
                    prescription:
                      duration: "10 min easy"
                      modality: "BikeErg"
                      runtime: "time_based_steady_state"
                      numeric_target: "none"
                      fixed_output: true
                      b2_calculation: false
              - title: "Main"
                block_type: "conditioning"
                order: 2
                coach_notes: "Same effort domain as Sunday, RPE 3–4. Once Sunday data identifies a sensible aerobic wattage, select one output and hold it. Record HR response. No second session. No accessories."
                exercises:
                  - exercise_name: "BikeErg fixed-output aerobic"
                    exercise_slug: "bikeerg-fixed-output-aerobic"
                    order: 1
                    prescription:
                      duration: "35 min steady aerobic"
                      modality: "BikeErg"
                      runtime: "time_based_steady_state"
                      numeric_target: "none"
                      fixed_output: true
                      b2_calculation: false
              - title: "Cooldown"
                block_type: "cool_down"
                order: 3
                exercises:
                  - exercise_name: "Easy BikeErg"
                    exercise_slug: "easy-bikeerg"
                    order: 1
                    prescription:
                      duration: "5 min"
                      modality: "BikeErg"
                      runtime: "time_based_steady_state"
                      numeric_target: "none"
                      fixed_output: true
                      b2_calculation: false
      - day_number: 5
        display_name: "Wednesday"
        is_rest_day: false
        sessions:
          - title: "VO2max — BikeErg"
            session_type: "conditioning"
            estimated_duration_minutes: 60
            coach_notes: "Hard cardiovascular intervals. No lifting afterwards. Primary adaptation: Aerobic ceiling. Load: hard."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                coach_notes: "15 min."
                exercises:
                  - exercise_name: "Easy-progressive BikeErg"
                    exercise_slug: "easy-progressive-bikeerg"
                    order: 1
                    prescription:
                      duration: "8 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                  - exercise_name: "High-cadence opener"
                    exercise_slug: "high-cadence-opener"
                    order: 2
                    prescription:
                      sets: 3
                      duration: "30 sec / 60 sec easy"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                  - exercise_name: "Hard / easy"
                    exercise_slug: "hard---easy"
                    order: 3
                    prescription:
                      sets: 2
                      duration: "1 min hard / 2 min easy"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                  - exercise_name: "Easy before main"
                    exercise_slug: "easy-before-main"
                    order: 4
                    prescription:
                      duration: "2-3 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
              - title: "Main"
                block_type: "conditioning"
                order: 2
                exercises:
                  - exercise_name: "BikeErg VO2 intervals"
                    exercise_slug: "bikeerg-vo2-intervals"
                    order: 1
                    prescription:
                      duration: "4 × 4 min hard"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                    notes: "Recovery: 3 min easy. RPE 8–9/10, but repeatable. Interval four should remain close to interval one. Do not sprint the first minute. Example 290/289/286/284 = excellent; 320/290/270/250 = wrong intensity. Warm-up 15 min; cooldown 10 min; no lifting afterwards."
              - title: "Cooldown"
                block_type: "cool_down"
                order: 3
                exercises:
                  - exercise_name: "Easy BikeErg"
                    exercise_slug: "easy-bikeerg"
                    order: 1
                    prescription:
                      duration: "10 min"
                      modality: "BikeErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
      - day_number: 6
        display_name: "Thursday"
        is_rest_day: false
        sessions:
          - title: "Strength C — Lower + Pull + Running Prep"
            session_type: "strength"
            estimated_duration_minutes: 70
            coach_notes: "Unilateral/posterior-chain robustness and tissues that will later tolerate running. No running required in this programme. Primary adaptation: Unilateral/posterior-chain strength + tissue capacity. Load: moderately hard."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                exercises:
                  - exercise_name: "Easy BikeErg"
                    exercise_slug: "easy-bikeerg"
                    order: 1
                    prescription:
                      duration: "5 min"
                  - exercise_name: "Ankle/hip preparation"
                    exercise_slug: "ankle-hip-preparation"
                    order: 2
                    notes: "Split squat, single-leg hinge, calf/ankle preparation and scapular pull-up."
              - title: "Strength C"
                block_type: "strength"
                order: 3
                exercises:
                  - exercise_name: "Bulgarian split squat"
                    exercise_slug: "bulgarian-split-squat"
                    order: 1
                    prescription:
                      sets: 4
                      reps: "6/leg"
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                  - exercise_name: "Hip thrust"
                    exercise_slug: "hip-thrust"
                    order: 2
                    prescription:
                      sets: 3
                      reps: 8
                      load:
                        type: "freeText"
                        text: "RPE 7-8"
                      performance_capture:
                        load_unit: "kg"
                        rpe: true
                  - exercise_name: "Nordic hamstring curl"
                    exercise_slug: "nordic-hamstring-curl"
                    order: 3
                    prescription:
                      sets: 3
                      reps: "4-6"
                    notes: "Assisted if necessary; quality eccentric control."
                  - exercise_name: "Weighted chin-up"
                    exercise_slug: "weighted-chin-up"
                    order: 4
                    prescription:
                      sets: 3
                      reps: 6
                      load:
                        type: "freeText"
                        text: "RPE 7"
                      performance_capture:
                        load_unit: "kg"
                        load_label: "External load"
                        rpe: true
                  - exercise_name: "Cable/chest-supported row"
                    exercise_slug: "cable-chest-supported-row"
                    order: 5
                    prescription:
                      sets: 3
                      reps: 10
                  - exercise_name: "Standing calf raise"
                    exercise_slug: "standing-calf-raise"
                    order: 6
                    prescription:
                      sets: 3
                      reps: "8-10"
                    notes: "Heavy, full ROM."
                  - exercise_name: "Seated/bent-knee calf raise"
                    exercise_slug: "seated-bent-knee-calf-raise"
                    order: 7
                    prescription:
                      sets: 3
                      reps: "12-15"
                  - exercise_name: "Tibialis raise"
                    exercise_slug: "tibialis-raise"
                    order: 8
                    prescription:
                      sets: 2
                      reps: "15-20"
                  - exercise_name: "Pallof press"
                    exercise_slug: "pallof-press"
                    order: 9
                    prescription:
                      sets: 3
                      reps: "10/side"
      - day_number: 7
        display_name: "Friday"
        is_rest_day: false
        sessions:
          - title: "Sub-threshold — RowErg"
            session_type: "conditioning"
            estimated_duration_minutes: 60
            coach_notes: "Work between LT1 and LT2; not Threshold B yet. Primary adaptation: Whole-body aerobic development. Load: moderately hard."
            blocks:
              - title: "Warm-up"
                block_type: "warm_up"
                order: 1
                exercises:
                  - exercise_name: "Easy technical rowing"
                    exercise_slug: "easy-technical-rowing"
                    order: 1
                    prescription:
                      duration: "12-15 min"
                      modality: "RowErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                    notes: "Legs → body → arms; arms → body → legs."
                  - exercise_name: "Building strokes"
                    exercise_slug: "building-strokes"
                    order: 2
                    prescription:
                      sets: 3
                      duration: "20 strokes building pace"
                      modality: "RowErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
              - title: "Main"
                block_type: "conditioning"
                order: 2
                exercises:
                  - exercise_name: "Sub-threshold RowErg"
                    exercise_slug: "sub-threshold-rowerg"
                    order: 1
                    prescription:
                      duration: "3 × 10 min"
                      modality: "RowErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
                      b2_calculation: false
                    notes: "Recovery: 3 min easy rowing. RPE 6–7. Noticeably harder than Z2 and easier than Monday threshold. Stroke rate ~22–26 spm. Record average /500m, watts, stroke rate, HR and RPE. Total ~60 min."
              - title: "Cooldown"
                block_type: "cool_down"
                order: 3
                exercises:
                  - exercise_name: "Easy row"
                    exercise_slug: "easy-row"
                    order: 1
                    prescription:
                      duration: "10 min"
                      modality: "RowErg"
                      runtime: "time_based_intervals"
                      numeric_target: "none"
