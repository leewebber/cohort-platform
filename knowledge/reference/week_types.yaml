# Semantic week emphasis types (not calendar weeks).
ontology_version: "1.3.0"
entities:
  - id: cohort.week_type.accumulation
    canonical_name: accumulation
    label: Accumulation
    description: Higher volume, moderate intensity — build training tolerance.
    ontology_version: "1.3.0"
    status: active
    provenance: programme_semantics_v1
    confidence: curated
    capability_emphasis_ids:
      - cohort.capability.aerobic_capacity
      - cohort.capability.relative_strength
      - cohort.capability.work_capacity
    intent_emphasis_ids:
      - cohort.training_intent.aerobic_base
      - cohort.training_intent.hypertrophy_development
      - cohort.training_intent.work_capacity
    fatigue_target: systemic:moderate-high;local:moderate-high
    recovery_target: 1-2_easy_days
    compatible_programme_phase_ids:
      - cohort.programme_phase.foundation
      - cohort.programme_phase.general_preparation

  - id: cohort.week_type.intensification
    canonical_name: intensification
    label: Intensification
    description: Reduced volume, higher intensity — drive neural and threshold adaptations.
    ontology_version: "1.3.0"
    status: active
    provenance: programme_semantics_v1
    confidence: curated
    capability_emphasis_ids:
      - cohort.capability.threshold
      - cohort.capability.relative_strength
    intent_emphasis_ids:
      - cohort.training_intent.threshold_development
      - cohort.training_intent.max_strength_development
    fatigue_target: systemic:moderate;local:high
    recovery_target: 2_easy_days
    compatible_programme_phase_ids:
      - cohort.programme_phase.specific_preparation
      - cohort.programme_phase.performance

  - id: cohort.week_type.realisation
    canonical_name: realisation
    label: Realisation
    description: Express fitness — quality sessions, minimal junk volume.
    ontology_version: "1.3.0"
    status: active
    provenance: programme_semantics_v1
    confidence: curated
    capability_emphasis_ids:
      - cohort.capability.pacing
      - cohort.capability.threshold
    intent_emphasis_ids:
      - cohort.training_intent.race_preparation
      - cohort.training_intent.pacing_skill
    fatigue_target: systemic:moderate;local:moderate
    recovery_target: full_before_key_session
    compatible_programme_phase_ids:
      - cohort.programme_phase.performance
      - cohort.programme_phase.peak

  - id: cohort.week_type.deload
    canonical_name: deload_week
    label: Deload week
    ontology_version: "1.3.0"
    status: active
    provenance: programme_semantics_v1
    confidence: curated
    capability_emphasis_ids: []
    intent_emphasis_ids: [cohort.training_intent.deload]
    fatigue_target: low
    recovery_target: restorative
    compatible_programme_phase_ids:
      - cohort.programme_phase.deload
      - cohort.programme_phase.general_preparation
      - cohort.programme_phase.specific_preparation

  - id: cohort.week_type.assessment
    canonical_name: assessment_week
    label: Assessment week
    ontology_version: "1.3.0"
    status: active
    provenance: programme_semantics_v1
    confidence: curated
    capability_emphasis_ids: []
    intent_emphasis_ids: [cohort.training_intent.assessment]
    fatigue_target: moderate_on_test_days
    recovery_target: easy_surrounding_tests
    compatible_programme_phase_ids:
      - cohort.programme_phase.foundation
      - cohort.programme_phase.general_preparation
      - cohort.programme_phase.specific_preparation

  - id: cohort.week_type.recovery
    canonical_name: recovery_week
    label: Recovery week
    ontology_version: "1.3.0"
    status: active
    provenance: programme_semantics_v1
    confidence: curated
    capability_emphasis_ids: [cohort.capability.movement_competency]
    intent_emphasis_ids:
      - cohort.training_intent.recovery
      - cohort.training_intent.mobility_development
    fatigue_target: minimal
    recovery_target: restorative
    compatible_programme_phase_ids:
      - cohort.programme_phase.recovery
      - cohort.programme_phase.transition
      - cohort.programme_phase.taper
