      - capability_id: cohort.capability.pacing
        state: coach_observation
        confidence: 0.75
        source: coach_review
      - capability_id: cohort.capability.grip_strength
        state: unknown
      - capability_id: cohort.capability.burpee_efficiency
        state: unknown
