# Training intent taxonomy — answers "what type of training?" not "which exercises?"
ontology_version: "1.3.0"
entities:
  # --- Legacy exercise-linked intents (retained for substitution/exercise graph) ---
  - id: cohort.training_intent.squat_strength
    canonical_name: squat_strength
    label: Squat strength emphasis
    description: Maximal and submaximal squat pattern strength work.
    ontology_version: "1.3.0"
    status: active
    provenance: training_intent_engine_v1
    confidence: curated
    applicable_capability_ids: [cohort.capability.relative_strength]
    common_session_archetype_ids: [cohort.session_archetype.heavy_lower]
    typical_progression_characteristics: [linear_load, wave_loading, autoregulated_sets]
    fatigue_characteristics: local:high;systemic:moderate
    recovery_characteristics: 48-72h_local;requires_sleep_and_nutrition

  - id: cohort.training_intent.hinge_strength
