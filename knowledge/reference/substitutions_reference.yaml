  - id: cohort.substitution.running_to_rowing
    canonical_name: running_to_rowing
    label: Running → rowing (modality swap)
    ontology_version: "1.3.0"
    status: active
    provenance: phase3_sprint2_reference
    confidence: curated
    source_exercise_id: cohort.exercise.running
    candidate_exercise_id: cohort.exercise.rowing
    substitution_kind: modality_swap
    applicable_constraints:
      - no_outdoor_run
      - weather
      - lower_impact_preference
    preserved_training_intents:
      - cohort.training_intent.aerobic_base
    preserved_capabilities:
      - cohort.capability.aerobic_capacity
    compromised_qualities:
      - running_specific_economy
      - impact_loading
    environment_compatibility:
      - cohort.environment.commercial_gym
      - cohort.environment.hotel_gym
