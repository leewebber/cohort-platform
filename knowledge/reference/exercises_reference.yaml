# Representative exercise semantics — NOT production library coverage.
ontology_version: "1.3.0"
entities:
  - id: cohort.exercise.back_squat
    canonical_name: back_squat
    label: Back squat
    aliases: [barbell_back_squat, back squat]
    ontology_version: "1.3.0"
    status: active
    curation_status: reference_only
    provenance: phase3_sprint2_reference
    confidence: curated
    movement_patterns:
      - { id: cohort.movement_pattern.squat, role: primary }
    joint_actions:
      - { id: cohort.joint_action.knee_extension, role: primary }
      - { id: cohort.joint_action.hip_extension, role: primary }
    primary_muscles: [cohort.muscle_group.quadriceps, cohort.muscle_group.glutes]
    secondary_muscles: [cohort.muscle_group.hamstrings, cohort.muscle_group.core_musculature]
    required_equipment: [cohort.equipment.barbell, cohort.equipment.squat_rack]
    optional_equipment: []
    suitable_environments: [cohort.environment.commercial_gym, cohort.environment.full_gym]
    primary_capabilities:
      - cohort.capability.absolute_strength
      - cohort.capability.hypertrophy
    secondary_capabilities:
      - cohort.capability.strength_endurance
    supporting_capabilities:
      - cohort.capability.core_stability
      - cohort.capability.hip_stability
    energy_system_contribution:
      primary_id: cohort.energy_system.anaerobic_alactic
      state: unknown
    supports_training_intents:
      - cohort.training_intent.squat_strength
      - cohort.training_intent.lower_body_hypertrophy
    technical_demand: intermediate
    local_fatigue: high
    systemic_fatigue: moderate
    recovery_cost: moderate

