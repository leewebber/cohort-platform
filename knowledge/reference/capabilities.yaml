# Athletic Capability Ontology — hierarchical reference (v1.1)
# Capabilities describe trainable qualities in the athlete — not exercises or muscles.
ontology_version: "1.3.0"

entities:
  - id: cohort.capability.athletic_performance
    canonical_name: athletic_performance
    label: Athletic performance
    description: Root for trainable qualities that change in the athlete over time.
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: []
    prerequisite_ids: []
    supporting_capability_ids: []
    conflicting_capability_ids: []
    related_movement_pattern_ids: []
    related_energy_system_ids: []
    related_training_intent_ids: []
    typical_assessment_methods: [coach_observation, programme_outcomes]

  - id: cohort.capability.strength
    canonical_name: strength
    label: Strength
    description: Ability to produce force against external resistance.
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.athletic_performance]
    related_training_intent_ids:
      - cohort.training_intent.squat_strength
      - cohort.training_intent.push_strength
      - cohort.training_intent.pull_strength

  - id: cohort.capability.absolute_strength
    canonical_name: absolute_strength
    label: Absolute strength
    aliases: [max_strength]
    description: Maximal force production regardless of body mass.
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.strength]
    typical_assessment_methods:
      - one_rm
      - estimated_one_rm
      - velocity_based_estimate
      - coach_assessment

  - id: cohort.capability.relative_strength
    canonical_name: relative_strength
    label: Relative strength
    description: Force production relative to body mass.
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.strength]
    prerequisite_ids: [cohort.capability.movement_competency]
    typical_assessment_methods:
      - bodyweight_max_reps
      - relative_load_tests
      - coach_assessment

  - id: cohort.capability.pulling_strength
    canonical_name: pulling_strength
    label: Pulling strength (relative)
    description: Relative strength in vertical or horizontal pulling patterns.
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.relative_strength]
    related_movement_pattern_ids:
      - cohort.movement_pattern.vertical_pull
      - cohort.movement_pattern.horizontal_pull
    related_training_intent_ids: [cohort.training_intent.pull_strength]

  - id: cohort.capability.pushing_strength
    canonical_name: pushing_strength
    label: Pushing strength (relative)
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.relative_strength]
    related_movement_pattern_ids:
      - cohort.movement_pattern.horizontal_push
      - cohort.movement_pattern.vertical_push
    related_training_intent_ids: [cohort.training_intent.push_strength]

  - id: cohort.capability.strength_endurance
    canonical_name: strength_endurance
    label: Strength endurance
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.strength]
    related_training_intent_ids: [cohort.training_intent.work_capacity]

  - id: cohort.capability.hypertrophy
    canonical_name: hypertrophy
    label: Hypertrophy
    description: Structural adaptation for increased muscle cross-sectional area.
    ontology_version: "1.3.0"
    status: active
    confidence: curated
    provenance: capability_ontology_v1
    parent_ids: [cohort.capability.strength]
    related_training_intent_ids:
