  goal_requirement: schemas/goal_requirement.schema.yaml
  entity: schemas/ontology_entity.schema.yaml
  exercise: schemas/exercise.schema.yaml
  substitution: schemas/substitution_rule.schema.yaml
  relationships: schemas/relationships.schema.yaml
  training_intent: schemas/training_intent.schema.yaml
  session_archetype: schemas/session_archetype.schema.yaml
  capability_intent_mapping: schemas/capability_intent_mapping.schema.yaml
  programme_phase: schemas/programme_phase.schema.yaml
  training_block: schemas/training_block.schema.yaml
  week_type: schemas/week_type.schema.yaml

reference:
  movement_patterns: reference/movement_patterns.yaml
  joint_actions: reference/joint_actions.yaml
  muscle_groups: reference/muscle_groups.yaml
  equipment: reference/equipment.yaml
  environments: reference/environments.yaml
  energy_systems: reference/energy_systems.yaml
  training_intents: reference/training_intents.yaml
  session_archetypes: reference/session_archetypes.yaml
  capability_intent_mappings: reference/capability_intent_mappings.yaml
  programme_phases: reference/programme_phases.yaml
  training_blocks: reference/training_blocks.yaml
  week_types: reference/week_types.yaml
  programme_progression: reference/programme_progression.yaml
  goal_requirements: reference/goal_requirements.yaml
  capabilities: reference/capabilities.yaml
  exercises: reference/exercises_reference.yaml
  substitutions: reference/substitutions_reference.yaml

relationship_types:
  - expresses
  - requires
  - optionally_uses
  - primarily_trains
  - secondarily_trains
  - involves_joint_action
  - develops_capability
  - constrained_by
  - suitable_for_environment
  - targets_energy_system
  - supports_training_intent
  - substitutes_for
  - preserves
  - compromises

validation:
  dart_package: lib/knowledge
  test: test/knowledge/ontology_validation_test.dart

notes: >
  Reference dataset is incomplete and not production exercise library coverage.
  Platform Exercise rows remain authoritative for coaching copy until curated migration.
